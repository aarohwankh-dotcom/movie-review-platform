<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CineReview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Apple Frosted Glass Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon"></span>
        <span>CineReview</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Catalog</a>
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Register Card (Apple ID Registration Aesthetic) -->
  <main class="container" style="max-width: 440px; margin: 60px auto;">
    <div class="card" style="padding: 36px 32px; text-align: center;">
      <div style="font-size: 32px; margin-bottom: 12px;"></div>
      <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px;">Create Your Account</h2>
      <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 28px;">
        Join CineReview to share your cinema ratings and critiques
      </p>

      <form id="register-form" style="text-align: left;">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input 
            type="text" 
            id="reg-name" 
            class="form-control" 
            placeholder="Aaroh Wankhade" 
            required
            minlength="2"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="student@itm.edu" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input 
            type="password" 
            id="reg-password" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            required
            minlength="6"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 8px;">
          Create Account →
        </button>
      </form>

      <p style="font-size: 13px; color: var(--text-secondary); margin-top: 22px;">
        Already have an account? <a href="login.html" style="color: var(--apple-blue); font-weight: 500;">Sign in here.</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>CineReview</strong> — Semester 3 Academic Project</div>
      <div>Aaroh Wankhade | ITM Skills University</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        const res = await API.post('/auth/register', { name, email, password });
        if (res.success && res.token) {
          API.setAuth(res.token, res.user);
          Auth.showToast('Account registered successfully', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        }
      } catch (err) {
        Auth.showToast(err.message || 'Registration failed', 'error');
      }
    });
  </script>
</body>
</html>
