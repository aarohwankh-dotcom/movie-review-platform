<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CineReview Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🎬</span>
        <span>CineReview</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Catalog</a>
        <a href="register.html" class="btn btn-outline btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Section -->
  <main class="container" style="max-width: 480px; margin: 60px auto;">
    <div class="card" style="padding: 32px;">
      <h2 style="font-size: 24px; margin-bottom: 8px; text-align: center;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px; text-align: center;">
        Sign in to post critiques and manage your reviews
      </p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="e.g. aaroh@example.com" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="••••••••" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Log In →
        </button>
      </form>

      <!-- Quick-fill demo credentials for seamless viva presentation -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color);">
        <p style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px;">
          Quick Demo Accounts (Click to Fill)
        </p>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11.5px;" onclick="fillDemo('aaroh@example.com')">
            👤 User A: Aaroh
          </button>
          <button type="button" class="btn btn-secondary btn-sm" style="flex: 1; font-size: 11.5px;" onclick="fillDemo('priya@example.com')">
            👤 User B: Priya
          </button>
        </div>
      </div>

      <p style="text-align: center; font-size: 13.5px; color: var(--text-muted); margin-top: 20px;">
        Don't have an account yet? <a href="register.html">Sign Up here</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>CineReview</strong> — Semester 3 Academic Project</div>
      <div>Aaroh Wankhade | ITM Skills University</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'password123';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.success && res.token) {
          API.setAuth(res.token, res.user);
          Auth.showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        }
      } catch (err) {
        Auth.showToast(err.message || 'Invalid email or password', 'error');
      }
    });
  </script>
</body>
</html>
