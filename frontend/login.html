<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — CineReview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Apple Frosted Glass Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon"></span>
        <span>CineReview</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Catalog</a>
        <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </nav>

  <!-- Login Card (Apple ID Aesthetic) -->
  <main class="container" style="max-width: 440px; margin: 70px auto;">
    <div class="card" style="padding: 36px 32px; text-align: center;">
      <div style="font-size: 32px; margin-bottom: 12px;"></div>
      <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px;">Sign in to CineReview</h2>
      <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 28px;">
        Publish critiques and manage your reviews with verified ownership
      </p>

      <form id="login-form" style="text-align: left;">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="name@example.com" 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="••••••••" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; margin-top: 8px;">
          Continue →
        </button>
      </form>

      <!-- Quick Demo Accounts for Seamless Faculty Evaluation -->
      <div style="margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border-subtle);">
        <p style="font-size: 11.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 10px;">
          Fast Demo Access (Click to Fill)
        </p>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemo('aaroh@example.com')">
            👤 User A (Aaroh)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillDemo('priya@example.com')">
            👤 User B (Priya)
          </button>
        </div>
      </div>

      <p style="font-size: 13px; color: var(--text-secondary); margin-top: 22px;">
        New to CineReview? <a href="register.html" style="color: var(--apple-blue); font-weight: 500;">Create yours now.</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>CineReview</strong> — Semester 3 Academic Project</div>
      <div>Aaroh Wankhade | ITM Skills University</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemo(email) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = 'password123';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.success && res.token) {
          API.setAuth(res.token, res.user);
          Auth.showToast('Signed in successfully', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        }
      } catch (err) {
        Auth.showToast(err.message || 'Invalid email or password', 'error');
      }
    });
  </script>
</body>
</html>
