<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue Film — CineReview</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Apple Frosted Glass Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon"></span>
        <span>CineReview</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← Catalog</a>
        <div id="nav-auth-container" class="nav-links">
          <!-- Populated dynamically by auth.js -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Add Movie Card -->
  <main class="container" style="max-width: 580px; margin: 50px auto 70px auto;">
    <div class="card" style="padding: 36px 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="font-size: 24px; font-weight: 700; letter-spacing: -0.03em;">Add Film to Catalog</h2>
        <button type="button" class="btn btn-secondary btn-sm" onclick="populateSampleData()">
          ⚡ Auto-Fill Sample
        </button>
      </div>

      <form id="add-movie-form">
        <div class="form-group">
          <label class="form-label" for="movie-title-input">Film Title</label>
          <input 
            type="text" 
            id="movie-title-input" 
            class="form-control" 
            placeholder="e.g. Parasite" 
            required
          >
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <label class="form-label" for="movie-genre-input">Genre</label>
            <select id="movie-genre-input" class="form-control" required>
              <option value="Drama">Drama</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Action">Action</option>
              <option value="Crime">Crime</option>
              <option value="Thriller">Thriller</option>
              <option value="Animation">Animation</option>
              <option value="Comedy">Comedy</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="movie-year-input">Release Year</label>
            <input 
              type="number" 
              id="movie-year-input" 
              class="form-control" 
              placeholder="e.g. 2019" 
              min="1888" 
              max="2100" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="movie-poster-input">High-Resolution Poster URL</label>
          <input 
            type="url" 
            id="movie-poster-input" 
            class="form-control" 
            placeholder="https://image.tmdb.org/..." 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="movie-desc-input">Synopsis &amp; Overview</label>
          <textarea 
            id="movie-desc-input" 
            class="form-control" 
            rows="4" 
            placeholder="Synopsis exploring premise, themes, and narrative arc..." 
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Catalogue Film →
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>CineReview</strong> — Semester 3 Academic Project</div>
      <div>Aaroh Wankhade | ITM Skills University</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function populateSampleData() {
      document.getElementById('movie-title-input').value = 'Parasite';
      document.getElementById('movie-genre-input').value = 'Drama';
      document.getElementById('movie-year-input').value = '2019';
      document.getElementById('movie-poster-input').value = 'https://image.tmdb.org/t/p/w780/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg';
      document.getElementById('movie-desc-input').value = 'Greed and class discrimination threaten the newly formed symbiotic relationship between the wealthy Park family and the destitute Kim clan in Bong Joon-ho\'s Academy Award-winning masterpiece.';
    }

    document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const currentUser = API.getCurrentUser();
      if (!currentUser) {
        Auth.showToast('Please sign in to add a film', 'error');
        setTimeout(() => window.location.href = 'login.html', 900);
        return;
      }

      const title = document.getElementById('movie-title-input').value.trim();
      const genre = document.getElementById('movie-genre-input').value;
      const releaseYear = Number(document.getElementById('movie-year-input').value);
      const posterUrl = document.getElementById('movie-poster-input').value.trim();
      const description = document.getElementById('movie-desc-input').value.trim();

      try {
        const res = await API.post('/movies', {
          title,
          genre,
          releaseYear,
          posterUrl,
          description,
        });

        if (res.success && res.data) {
          Auth.showToast('Film catalogued successfully', 'success');
          setTimeout(() => {
            window.location.href = `movie-details.html?id=${res.data._id}`;
          }, 800);
        }
      } catch (err) {
        Auth.showToast(err.message || 'Failed to add film', 'error');
      }
    });
  </script>
</body>
</html>
