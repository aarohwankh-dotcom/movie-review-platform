<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Movie - CineReview Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🎬</span>
        <span>CineReview</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">← Catalog</a>
        <div id="nav-auth-container" class="nav-links">
          <!-- Populated dynamically by auth.js -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Add Movie Section -->
  <main class="container" style="max-width: 640px; margin: 40px auto 60px auto;">
    <div class="card" style="padding: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 24px;">Catalogue a New Movie</h2>
        <button type="button" class="btn btn-secondary btn-sm" onclick="populateSampleData()">
          ⚡ Auto-Fill Sample
        </button>
      </div>

      <form id="add-movie-form">
        <div class="form-group">
          <label class="form-label" for="movie-title-input">Movie Title *</label>
          <input 
            type="text" 
            id="movie-title-input" 
            class="form-control" 
            placeholder="e.g. Oppenheimer" 
            required
          >
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <label class="form-label" for="movie-genre-input">Genre *</label>
            <select id="movie-genre-input" class="form-control" required>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Action">Action</option>
              <option value="Drama">Drama</option>
              <option value="Thriller">Thriller</option>
              <option value="Crime">Crime</option>
              <option value="Comedy">Comedy</option>
              <option value="Animation">Animation</option>
              <option value="Adventure">Adventure</option>
              <option value="Horror">Horror</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="movie-year-input">Release Year *</label>
            <input 
              type="number" 
              id="movie-year-input" 
              class="form-control" 
              placeholder="e.g. 2023" 
              min="1888" 
              max="2100" 
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="movie-poster-input">Poster Image URL *</label>
          <input 
            type="url" 
            id="movie-poster-input" 
            class="form-control" 
            placeholder="https://images.unsplash.com/..." 
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="movie-desc-input">Synopsis & Description *</label>
          <textarea 
            id="movie-desc-input" 
            class="form-control" 
            rows="4" 
            placeholder="Brief overview of the movie plot, direction, and cast..." 
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Add Movie to Catalog →
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div><strong>CineReview</strong> — Semester 3 Academic Project</div>
      <div>Aaroh Wankhade | ITM Skills University</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function populateSampleData() {
      document.getElementById('movie-title-input').value = 'Dune: Part Two';
      document.getElementById('movie-genre-input').value = 'Sci-Fi';
      document.getElementById('movie-year-input').value = '2024';
      document.getElementById('movie-poster-input').value = 'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?w=800&auto=format&fit=crop';
      document.getElementById('movie-desc-input').value = 'Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family, facing a choice between love and the fate of the universe.';
    }

    document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const currentUser = API.getCurrentUser();
      if (!currentUser) {
        Auth.showToast('Please log in first to add a movie', 'error');
        setTimeout(() => window.location.href = 'login.html', 1000);
        return;
      }

      const title = document.getElementById('movie-title-input').value.trim();
      const genre = document.getElementById('movie-genre-input').value;
      const releaseYear = Number(document.getElementById('movie-year-input').value);
      const posterUrl = document.getElementById('movie-poster-input').value.trim();
      const description = document.getElementById('movie-desc-input').value.trim();

      try {
        const res = await API.post('/movies', {
          title,
          genre,
          releaseYear,
          posterUrl,
          description,
        });

        if (res.success && res.data) {
          Auth.showToast('Movie added successfully!', 'success');
          setTimeout(() => {
            window.location.href = `movie-details.html?id=${res.data._id}`;
          }, 800);
        }
      } catch (err) {
        Auth.showToast(err.message || 'Failed to add movie', 'error');
      }
    });
  </script>
</body>
</html>
